<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>test</title>
<style>
:root{--bg:#EEF0F3;--ink:#2B2F36;--paper:#fff;--red:#D83A2B;--yel:#F2C744;--mut:#7A808A;--ice:#5B9BD5;--blue:#2E86D6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
#app{max-width:440px;margin:0 auto;padding:10px}
h1{font-size:22px;margin:6px 0 10px;display:flex;align-items:center;gap:8px}
h1 img{width:40px;height:40px}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;padding:3px 10px;font-size:13px;margin:2px}
.pill.warn{border-color:var(--red);color:var(--red);animation:blink 1s infinite}
button{font:inherit;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:8px;padding:8px 10px;margin:2px;cursor:pointer}
button.pri{background:var(--ink);color:#fff}
button:disabled{opacity:.35;cursor:default}
.tray{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.tray button{flex:1 1 30%;padding:4px 2px 5px;font-size:12px;line-height:1.25;display:flex;flex-direction:column;align-items:center;gap:1px}
.tray button img{width:30px;height:30px}
.tray button.sel{background:var(--yel)}
.card{background:var(--paper);border:1.5px solid var(--ink);border-radius:10px;padding:10px;margin:6px 0}
.small{font-size:12px;color:var(--mut)}
svg.board{width:100%;height:auto;display:block;background:var(--paper);border:1.5px solid var(--ink);border-radius:10px;margin-top:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
#msg{min-height:40px;font-size:13px;margin:4px 2px;line-height:1.5}
.stage{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;border-bottom:1px solid #dde}
.stage:last-child{border-bottom:0}
.done{color:#3B6D11;font-size:12px}
.tap{cursor:pointer}
.wave{display:flex;align-items:center;gap:3px;flex-wrap:wrap;font-size:12px;margin:6px 0 0}
.wave img{width:22px;height:22px;vertical-align:middle}
.wave b{font-weight:500;margin-right:4px}
.bossbar{margin:6px 0 0;font-size:12px}
.bossbar .bar{height:10px;border:1.5px solid var(--ink);border-radius:6px;background:#fff;overflow:hidden}
.bossbar .bar i{display:block;height:100%;background:#7F4FA8}
.banner{background:#7F4FA8;color:#fff;text-align:center;padding:8px;border-radius:8px;margin:6px 0;font-size:15px;animation:pop .5s}
#flash{position:fixed;inset:0;pointer-events:none;background:rgba(216,58,43,.5);opacity:0}
#flash.on{animation:flash .45s}
#vig{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 60px 24px rgba(216,58,43,.55);opacity:0}
#vig.on{animation:vig 1.4s infinite}
.ants{stroke-dasharray:7 6;animation:ants 1s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
.shake{transform-box:fill-box;transform-origin:center;animation:shake .5s}
.dmg{animation:dmg .9s forwards;font-weight:bold}
.ghost{opacity:.38}
@keyframes ants{to{stroke-dashoffset:-13}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,0)}80%{transform:translate(3px,1px)}}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
@keyframes vig{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes blink{50%{opacity:.4}}
@keyframes dmg{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-14px)}}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.nofx .ants,.nofx .pulse,.nofx .shake,.nofx .banner,.nofx .pill.warn{animation:none}
.nofx #flash.on,.nofx #vig.on{animation:none;opacity:0}
@media (prefers-reduced-motion:reduce){.ants,.pulse,.shake,.banner,.pill.warn{animation:none}#flash.on,#vig.on{animation:none;opacity:0}}

.glow{box-shadow:0 0 0 3px var(--yel),0 0 12px 3px rgba(242,199,68,.9);animation:glowp 1s infinite}
@keyframes glowp{50%{box-shadow:0 0 0 3px var(--yel),0 0 4px 1px rgba(242,199,68,.5)}}
.tut{background:#FFF7D6;border:1.5px solid #B8891A;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tut button{padding:4px 8px;font-size:12px}
#spec{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,92vw);background:#fff;border:2px solid var(--ink);border-radius:12px;padding:12px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:20;display:none;pointer-events:none;font-size:13px;line-height:1.5}
#spec.on{display:block}
#spec h3{margin:0 0 6px;font-size:16px;display:flex;align-items:center;gap:8px}
#spec h3 img{width:36px;height:36px}
#spec ul{margin:4px 0 0;padding-left:18px}
#spec .rg{float:right;margin:0 0 6px 8px}
#spec .hint{color:var(--mut);font-size:11px;margin-top:6px}
[data-spec]{-webkit-touch-callout:none;touch-action:manipulation}
.stg{display:flex;align-items:center;gap:8px}
.stg img,.stg svg{width:44px;height:44px;flex:none}
.hero{border-radius:12px;overflow:hidden;border:1.5px solid var(--ink);margin:0 0 8px;line-height:0}
.hero img{width:100%;height:auto}
.hud{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.hud img{width:18px;height:18px;vertical-align:middle}

.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.coin{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--ink);border-radius:999px;padding:4px 12px 4px 6px;font-weight:bold;font-size:16px;cursor:pointer}
.coin img{width:24px;height:24px}
.coin.big{background:#FFF7D6;border-color:#B8891A;font-size:18px}
.gear{width:36px;height:36px;border-radius:18px;padding:0;display:flex;align-items:center;justify-content:center}
.gear img{width:22px;height:22px}
.tag img,.st .tag img{width:18px;height:18px;vertical-align:middle}
.res .stars img{width:40px;height:40px;margin:0 2px}
.next{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:12px 14px;margin:10px 0}
.next img,.next svg{width:84px;height:84px;flex:none}
.next b{font-size:24px}
.next .small{display:block;margin-top:4px}
.bigbtn{display:block;width:100%;height:62px;border-radius:16px;font-size:21px;font-weight:bold;border:2.5px solid var(--ink);margin:10px 0 8px;padding:0}
.bigbtn.yel{background:var(--yel);color:var(--ink)}
.bigbtn.dark{background:var(--ink);color:#fff}
.sec{display:flex;gap:8px}
.sec button{flex:1;height:46px;border-radius:12px;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0}
.sec button img{width:20px;height:20px}
.link{display:flex;justify-content:space-around;margin:8px 0 0}
.link button{border:0;background:none;color:var(--mut);font-size:13px}
.up{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:10px;margin:8px 0}
.up .ic{width:48px;height:48px;border-radius:10px;background:#F5E6C4;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;flex:none;font-size:22px}
.up .ic img{width:38px;height:38px}
.up .mid{flex:1;min-width:0}
.up .mid b{font-size:15px}
.up .eff{font-size:12px;color:var(--mut);margin-top:3px}
.up .eff b{font-size:14px;color:var(--ink)}
.up .eff .nx{color:var(--blue)}
.dots{display:flex;gap:5px;align-items:center;margin-top:5px}
.dots i{width:8px;height:8px;border-radius:4px;border:1px solid var(--ink);background:#fff;display:inline-block}
.dots i.on{background:var(--yel)}
.dots span{font-size:10px;color:var(--mut);margin-left:3px}
.buy{width:96px;height:54px;border-radius:12px;border:2px solid var(--ink);background:var(--yel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;font-size:12px;font-weight:bold;flex:none}
.buy img{width:16px;height:16px;vertical-align:middle}
.buy .pr{font-size:14px}
.buy.no{background:#FBF6E4;border:1.5px dashed #B8891A;color:var(--mut)}
.buy.no .lack{color:var(--red);font-size:11px}
.buy.max{background:#EEF0F3;border:1.5px solid #AEB3BC;color:var(--mut)}
.sticky{position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
.stl{position:relative;padding-left:26px}
.stl:before{content:"";position:absolute;left:11px;top:0;bottom:0;border-left:3px dashed #AEB3BC}
.st{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:8px 10px;margin:8px 0;position:relative}
.st:before{content:"";position:absolute;left:-20px;top:50%;width:10px;height:10px;border-radius:5px;background:#fff;border:2px solid var(--ink);margin-top:-7px}
.st.clr:before{background:#63A63A}
.st.now{border-color:#B8891A;box-shadow:0 0 0 3px var(--yel)}
.st.now:before{background:var(--yel)}
.st.lock{opacity:.55}
.st img,.st svg{width:52px;height:52px;flex:none}
.st b{font-size:17px}
.st .tag{margin-left:auto;font-size:12px;white-space:nowrap}
.res{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:14px;margin:8px 0;text-align:center}
.res .stars{font-size:34px;letter-spacing:4px;line-height:1}
.res h2{font-size:21px;margin:8px 0 4px}
.res .rw{display:inline-flex;align-items:center;gap:8px;background:#FFF7D6;border:1.5px solid #B8891A;border-radius:12px;padding:8px 20px;font-size:22px;font-weight:bold;margin:8px 0}
.res .rw img{width:30px;height:30px}
</style>
</head>
